# Scheduled workers (PRD section 7) on GitHub Actions instead of Railway:
#   prices   every 5 minutes  -> pnpm job snapshot-prices  (quote prices into price_snapshots)
#   keeper   every 10 minutes -> pnpm job drip-once        (one Stock DRIP pass over active delegations)
#   rewards  hourly           -> pnpm job snapshot-rewards (StonkFun reward totals, top 20 coins)
# Fresh payouts arrive through the Helius webhook on the Vercel app, so no indexer loop is needed.
# Secrets: DATABASE_URL, HELIUS_API_KEY, DRIP_KEEPER_SECRET_KEY (repo secrets).
name: workers

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/10 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "snapshot-prices | drip-once | snapshot-rewards"
        required: true
        default: "drip-once"

concurrency:
  group: workers-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DRIP_KEEPER_SECRET_KEY: ${{ secrets.DRIP_KEEPER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; then
            echo "job=snapshot-prices" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/10 * * * *" ]; then
            echo "job=drip-once" >> "$GITHUB_OUTPUT"
          else
            echo "job=snapshot-rewards" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ${{ steps.pick.outputs.job }}
        run: pnpm job ${{ steps.pick.outputs.job }}
