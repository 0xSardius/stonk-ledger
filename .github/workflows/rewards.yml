# StonkFun reward totals for the top 20 coins, hourly (PRD 8.3).
name: rewards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: rewards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm job snapshot-rewards 20
