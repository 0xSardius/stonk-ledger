# Pull the distributors' latest batches (a sample for the proof feed; the
# Helius webhook it replaced was retired 2026-09-17), then one Stock DRIP
# keeper pass over every active delegation (PRD F2). The keeper re-indexes
# its own wallets before each run. Scheduled every 10 minutes; GitHub runs it
# every 1.5 to 7 hours in practice. Enhanced history costs 100 Helius credits
# a page, so the pull is capped at 10 pages per distributor wallet.
name: keeper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DRIP_KEEPER_SECRET_KEY: ${{ secrets.DRIP_KEEPER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm job ingest-distributor 10
      - run: pnpm job drip-once
